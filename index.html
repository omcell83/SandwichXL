<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandwich XL - Dijital Menü</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Modern ve Canlı) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- İkonlar için Font Awesome (Sepet vb.) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        // Tailwind CSS'i özel renklerimizle genişletiyoruz
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Ana renklerimiz
                        'primary': '#05594C',   // Koyu Yeşil
                        'secondary': '#EF7F1A', // Turuncu
                    },
                    fontFamily: {
                        // Modern bir font ailesi
                        'sans': ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Modern kaydırma çubuğu */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #05594C; /* primary */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #044a3f;
        }

        /* Modal geçiş animasyonları için */
        .modal {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .modal-content {
            transition: transform 0.25s ease;
        }
        .modal.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
        .modal:not(.hidden) {
            opacity: 1;
            transform: scale(1);
        }
        
        /* Aktif kategori butonu stili */
        .nav-link.active {
            background-color: #EF7F1A; /* secondary */
            color: white;
        }
    </style>
</head>

<body class="bg-gray-50 font-sans">

    <!-- 1. HEADER / NAVİGASYON -->
    <header class="bg-primary shadow-lg sticky top-0 z-40 text-white">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <!-- Logo -->
            <h1 class="text-2xl md:text-3xl font-bold">
                <a href="#">Sandwich XL</a>
            </h1>
            
            <!-- Kategori Navigasyonu (Masaüstü) -->
            <nav class="hidden md:flex space-x-2">
                <button onclick="showCategory('sandwiches')" class="nav-link p-2 px-4 rounded-lg font-medium transition-colors hover:bg-secondary">Sandviçler</button>
                <button onclick="showCategory('pasta')" class="nav-link p-2 px-4 rounded-lg font-medium transition-colors hover:bg-secondary">Makarnalar</button>
                <button onclick="showCategory('salads')" class="nav-link p-2 px-4 rounded-lg font-medium transition-colors hover:bg-secondary">Salatalar</button>
                <button onclick="showCategory('desserts')" class="nav-link p-2 px-4 rounded-lg font-medium transition-colors hover:bg-secondary">Tatlılar</button>
                <button onclick="showCategory('drinks')" class="nav-link p-2 px-4 rounded-lg font-medium transition-colors hover:bg-secondary">İçecekler</button>
            </nav>
            
            <!-- Sepet Butonu -->
            <button onclick="toggleCartModal(true)" class="relative flex items-center justify-center p-3 bg-white text-primary rounded-full shadow-md hover:bg-gray-100 transition-colors">
                <i class="fa-solid fa-basket-shopping text-xl"></i>
                <!-- Sepet Ürün Sayacı -->
                <span id="cart-count" class="absolute -top-2 -right-2 bg-secondary text-white text-xs font-bold rounded-full h-6 w-6 flex items-center justify-center">0</span>
            </button>
        </div>
        
        <!-- Kategori Navigasyonu (Mobil) -->
        <nav class="md:hidden bg-white text-primary p-2 overflow-x-auto">
            <div class="flex space-x-2 whitespace-nowrap">
                <button onclick="showCategory('sandwiches')" class="nav-link p-2 px-4 rounded-lg font-medium transition-colors text-sm">Sandviçler</button>
                <button onclick="showCategory('pasta')" class="nav-link p-2 px-4 rounded-lg font-medium transition-colors text-sm">Makarnalar</button>
                <button onclick="showCategory('salads')" class="nav-link p-2 px-4 rounded-lg font-medium transition-colors text-sm">Salatalar</button>
                <button onclick="showCategory('desserts')" class="nav-link p-2 px-4 rounded-lg font-medium transition-colors text-sm">Tatlılar</button>
                <button onclick="showCategory('drinks')" class="nav-link p-2 px-4 rounded-lg font-medium transition-colors text-sm">İçecekler</button>
            </div>
        </nav>
    </header>

    <!-- 2. ANA İÇERİK / ÜRÜN GRİDİ -->
    <main class="container mx-auto px-4 py-8">
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Ürün kartları JavaScript ile buraya eklenecek -->
        </div>
    </main>

    <!-- 3. MODALLAR -->

    <!-- 3.1. SEPET MODALI -->
    <div id="cart-modal" class="modal hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-70">
        <!-- Modal İçeriği -->
        <div class="modal-content bg-white w-full max-w-lg rounded-xl shadow-2xl relative flex flex-col max-h-[90vh]">
            <!-- Başlık -->
            <div class="flex justify-between items-center p-5 border-b">
                <h2 class="text-2xl font-bold text-primary">Sepetiniz</h2>
                <button onclick="toggleCartModal(false)" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-times text-2xl"></i>
                </button>
            </div>
            
            <!-- Sepet Ürünleri Listesi -->
            <!-- !!! HATA DÜZELTMESİ: 'cart-empty-msg' 'cart-items' dışına alındı !!! -->
            <div class="p-5 overflow-y-auto flex-grow">
                <!-- Sepet boş mesajı (artık güvende) -->
                <p id="cart-empty-msg" class="text-center text-gray-500">Sepetiniz şu an boş.</p>
                
                <!-- Ürünler buraya eklenecek (ayrı bir div) -->
                <div id="cart-items">
                    <!-- Ürünler buraya eklenecek -->
                </div>
            </div>
            
            <!-- Alt Toplam ve Buton -->
            <div class="p-5 border-t bg-gray-50 rounded-b-xl">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-lg font-semibold text-gray-700">Toplam:</span>
                    <span id="cart-total" class="text-2xl font-bold text-primary">€0.00</span>
                </div>
                <button id="confirm-order-btn" onclick="confirmOrder()" class="w-full p-4 bg-secondary text-white text-lg font-bold rounded-lg shadow-md hover:bg-orange-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Siparişi Onayla
                </button>
            </div>
        </div>
    </div>

    <!-- 3.2. BOYUT SEÇİM MODALI (XL/XXL) -->
    <div id="size-modal" class="modal hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black bg-opacity-70">
        <div class="modal-content bg-white w-full max-w-md rounded-xl shadow-2xl p-6">
            <h2 class="text-2xl font-bold text-primary mb-4 text-center">Boyut Seçin</h2>
            <div id="size-options" class="space-y-3">
                <!-- Boyut seçenekleri JavaScript ile buraya eklenecek -->
            </div>
            <button onclick="closeSizeModal()" class="w-full mt-4 p-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">İptal</button>
        </div>
    </div>

    <!-- 3.3. İÇECEK SEÇİM MODALI -->
    <div id="drink-modal" class="modal hidden fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black bg-opacity-70">
        <div class="modal-content bg-white w-full max-w-lg rounded-xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-5 border-b">
                <h2 class="text-2xl font-bold text-primary">İçecek Seçin</h2>
                <button onclick="closeDrinkModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-times text-2xl"></i>
                </button>
            </div>
            <div id="drink-options" class="p-5 overflow-y-auto space-y-3">
                <!-- İçecek seçenekleri JavaScript ile buraya eklenecek -->
            </div>
            <div class="p-5 border-t bg-gray-50 rounded-b-xl">
                <button onclick="skipDrink()" class="w-full p-4 bg-gray-200 text-gray-700 rounded-lg shadow-md hover:bg-gray-300 transition-colors">
                    İçecek İstemiyorum
                </button>
            </div>
        </div>
    </div>

    <!-- 3.4. SİPARİŞ ONAY MODALI -->
    <div id="order-success-modal" class="modal hidden fixed inset-0 z-[80] flex items-center justify-center p-4 bg-black bg-opacity-70">
        <div class="modal-content bg-white w-full max-w-md rounded-xl shadow-2xl p-8 text-center">
            <div class="w-24 h-24 bg-primary text-white rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-check text-5xl"></i>
            </div>
            <h2 class="text-3xl font-bold text-primary mb-3">Siparişiniz Alındı!</h2>
            <p class="text-gray-600 text-lg mb-6">Lütfen sipariş numaranızı kasaya bildiriniz.</p>
            <div class="bg-gray-100 border-2 border-dashed border-gray-300 rounded-lg p-4">
                <span class="text-6xl font-bold text-secondary tracking-widest" id="order-number">
                    ---
                </span>
            </div>
            <button onclick="closeSuccessModal()" class="w-full mt-8 p-4 bg-primary text-white text-lg font-bold rounded-lg shadow-md hover:bg-primary/90 transition-colors">
                Kapat
            </button>
        </div>
    </div>

    <!-- JavaScript Bölümü -->

                { id: 's13', name: 'VeggieLand', description: 'Ajvar Sauce, Zucchini, Eggplant, Potatoes, Carrots, Dried Tomatoes, Green Peppers, Kapia', image: 'https://placehold.co/600x400/05594C/FFFFFF?text=VeggieLand', sizes: [{ size: 'XL', price: 8, weight: '450gr' }] },
                { id: 's14', name: 'VeggieBoom', description: 'Sxl Vegan Meatball Mix, Ajvar Sauce, Green Pepper, Red Onion, Arugula, Basil Tomato Sauce', image: 'https://placehold.co/600x400/05594C/FFFFFF?text=VeggieBoom', sizes: [{ size: 'XL', price: 14, weight: '510gr' }, { size: 'XXL', price: 17, weight: '600gr' }] }
            ],
            'pasta': [
                { id: 'p1', name: 'PilePasta', description: 'Fusilli Pasta, Chicken Breast, Pesto Sauce, Parmesan Cheese', image: 'https://placehold.co/600x400/05594C/FFFFFF?text=PilePasta', sizes: [{ size: 'XL', price: 9, weight: '400gr' }] },

                { id: 'p4', name: 'TandooriTangle', description: 'Fusilli Pasta, Tandoori Meat, Cheddar Sauce, Parmesan Cheese', image: 'https://placehold.co/600x400/05594C/FFFFFF?text=TandooriTangle', sizes: [{ size: 'XL', price: 12, weight: '410gr' }] },

                { id: 'p6', name: 'Veganissimo', description: 'Fusilli Pasta, Tomato Sauce, Tomato, Red Peppers, Green Peppers, Green Olive, Thinly sliced Pickles, Sweet Corn', image: 'https://placehold.co/600x400/05594C/FFFFFF?text=Veganissimo', sizes: [{ size: 'XL', price: 9, weight: '420gr' }] }
            ],
            'salads': [

                { id: 'sa2', name: 'TunaSalad', description: 'Tuna, Capers, Corn, Pickles, Red Onion, Green Olives, Lettuce, Arugula, Green-Red Peppers', image: 'https://placehold.co/600x400/05594C/FFFFFF?text=TunaSalad', sizes: [{ size: 'XL', price: 10, weight: '530gr' }] },
                { id: 'sa3', name: 'CaesarSalad', description: 'Crispy Chicken, Caesar Sauce, Lettuce, Tomatoes, Arugula, Lemon', image: 'https://placehold.co/600x400/05594C/FFFFFF?text=CaesarSalad', sizes: [{ size: 'XL', price: 10, weight: '470gr' }] }
            ],
            'desserts': [ // Kullanıcının isteği üzerine eklenen varsayılan kategori
                { id: 'd1', name: 'Çikolatalı Sufle', description: 'Akışkan çikolatalı, sıcak ve taze sufle.', image: 'https://placehold.co/600x400/05594C/FFFFFF?text=Sufle', sizes: [{ size: 'Tek Boy', price: 6, weight: '200gr' }] },
                { id: 'd2', name: 'Cheesecake', description: 'Limonlu veya Çilekli seçenekleriyle.', image: 'https://placehold.co/600x400/05594C/FFFFFF?text=Cheesecake', sizes: [{ size: 'Tek Boy', price: 5, weight: '250gr' }] },
                { id: 'd3', name: 'Tiramisu', description: 'Geleneksel İtalyan tatlısı.', image: 'https://placehold.co/600x400/05594C/FFFFFF?text=Tiramisu', sizes: [{ size: 'Tek Boy', price: 7, weight: '220gr' }] }
            ],
            'drinks': [ // İçecek seçimi için eklenen varsayılan kategori
                { id: 'dr1', name: 'Kola', description: '330ml Kutu', image: 'https://placehold.co/600x400/EF7F1A/FFFFFF?text=Kola', sizes: [{ size: '330ml', price: 2.5, weight: '330ml' }] },
                { id: 'dr2', name: 'Ayran', description: '300ml Kutu', image: 'https://placehold.co/600x400/EF7F1A/FFFFFF?text=Ayran', sizes: [{ size: '300ml', price: 2, weight: '300ml' }] },
                { id: 'dr3', name: 'Su', description: '500ml Pet', image: 'https://placehold.co/600x400/EF7F1A/FFFFFF?text=Su', sizes: [{ size: '500ml', price: 1.5, weight: '500ml' }] },
                { id: 'dr4', name: 'Portakal Suyu', description: 'Taze Sıkılmış', image: 'https://placehold.co/600x400/EF7F1A/FFFFFF?text=Portakal+Suyu', sizes: [{ size: '300ml', price: 4, weight: '300ml' }] },
                { id: 'dr5', name: 'Kahve', description: 'Filtre Kahve', image: 'https://placehold.co/600x400/EF7F1A/FFFFFF?text=Kahve', sizes: [{ size: 'Orta Boy', price: 3.5, weight: '250ml' }] }
            ]
        };

        // --- 2. UYGULAMA DURUMU (State) ---
        let cart = []; // Sepet
        let currentProductToAdd = null; // Boyut/içecek seçimi için geçici ürün
        let currentSizeSelection = null; // Geçici boyut seçimi
        const CART_STORAGE_KEY = 'sandwichXL_cart';
        const ORDER_COUNTER_KEY = 'sandwichXL_orderCounter';

        // --- 3. TEMEL FONKSİYONLAR (Core Functions) ---

        /**
         * Sayfa yüklendiğinde menüyü ve sepeti başlatır
         */
        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
            renderProducts('sandwiches'); // Ana sayfa sandviçler
            updateActiveCategory('sandwiches');
            attachModalListeners();
            populateDrinkModal(); // İçecek modalını bir kez doldur
        });
        
        /**
         * Ürünleri kategoriye göre filtreler ve DOM'a basar
         */
        function renderProducts(categoryKey) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = ''; // Grid'i temizle

            if (!menuData[categoryKey] || menuData[categoryKey].length === 0) {
                grid.innerHTML = '<p class="text-gray-500">Bu kategoride ürün bulunamadı.</p>';
                return;
            }

            menuData[categoryKey].forEach(item => {
                const productCard = `
                    <div class="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col transition-transform duration-300 hover:scale-[1.02]">
                        <!-- Ürün Resmi -->
                        <img src="${item.image}" alt="${item.name}" class="w-full h-48 md:h-56 object-cover" onerror="this.src='https://placehold.co/600x400/cccccc/FFFFFF?text=Resim+Yok'">
                        
                        <div class="p-5 flex flex-col flex-grow">
                            <!-- Ürün Adı ve Fiyatı -->
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-xl font-bold text-primary">${item.name}</h3>
                                <!-- Fiyat, XL/XXL durumuna göre değişir -->
                                <span class="text-xl font-bold text-secondary">
                                    €${item.sizes[0].price.toFixed(2)}
                                    ${item.sizes.length > 1 ? '+' : ''} <!-- Birden fazla boyut varsa + işareti -->
                                </span>
                            </div>
                            <!-- Ürün Açıklaması -->
                            <p class="text-gray-600 text-sm mb-4 flex-grow">${item.description}</p>
                            
                            <!-- Sepete Ekle Butonu -->
                            <button onclick="startAddToCartFlow('${item.id}', '${categoryKey}')" class="w-full mt-auto p-3 bg-secondary text-white text-base font-bold rounded-lg shadow-md hover:bg-orange-600 transition-colors">
                                <i class="fa-solid fa-plus mr-2"></i>Sepete Ekle
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += productCard;
            });
        }

        /**
         * Navigasyon butonlarında aktif kategoriyi işaretler
         */
        function updateActiveCategory(categoryKey) {
            // Tüm nav-link'lerden 'active' sınıfını kaldır
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            
            // İlgili kategori butonlarına 'active' sınıfını ekle
            document.querySelectorAll(`.nav-link[onclick="showCategory('${categoryKey}')"]`).forEach(link => {
                link.classList.add('active');
            });
        }

        /**
         * Kategori değiştirme fonksiyonu
         */
        function showCategory(categoryKey) {
            renderProducts(categoryKey);
            updateActiveCategory(categoryKey);
        }

        // --- 4. SEPETE EKLEME AKIŞI (Add to Cart Flow) ---

        /**
         * Akış Başlangıcı: Kullanıcı "Sepete Ekle" butonuna bastığında
         */
        function startAddToCartFlow(itemId, categoryKey) {
            const product = menuData[categoryKey].find(p => p.id === itemId);
            currentProductToAdd = product;
            
            // Kategoriye göre akışı belirle (Sandviç, Makarna, Tatlı ise boyut sor)
            const needsSizeSelection = ['sandwiches', 'pasta', 'desserts'].includes(categoryKey);
            
            if (needsSizeSelection && product.sizes.length > 0) {
                
                // --- !!! GÜNCELLEME BAŞLANGICI: Tek boyutlu ürünler için akış düzeltmesi !!! ---
                if (product.sizes.length === 1) {
                    // Ürünün sadece bir boyutu varsa (örn: XL veya "Tek Boy")
                    // Bu boyutu otomatik olarak seç ve doğrudan içecek modalına geç.
                    const size = product.sizes[0];
                    currentSizeSelection = { size: size.size, price: size.price };
                    
                    // Boyut modalını GÖSTERME, doğrudan içecek modalını GÖSTER
                    toggleDrinkModal(true);
                } else {
                    // Ürünün birden fazla boyutu varsa (örn: XL ve XXL)
                    // Boyut modalını doldur ve göster
                    populateSizeModal(product);
                    toggleSizeModal(true);
                }
                // --- !!! GÜNCELLEME SONU !!! ---
                
            } else {
                // Salata veya içecek gibi doğrudan eklenen ürünler
                const defaultSize = product.sizes[0];
                addItemToCart(product, defaultSize);
                // Başarılı ekleme bildirimi (isteğe bağlı)
                showToast(`${product.name} sepete eklendi.`);
            }
        }

        /**
         * Boyut (XL/XXL) modalını ürün bilgisiyle doldurur
         * !!! GÜNCELLEME: Tek boyutlu ürün mantığı buradan kaldırıldı ve 'startAddToCartFlow' içine taşındı.
         */
        function populateSizeModal(product) {
            const optionsContainer = document.getElementById('size-options');
            optionsContainer.innerHTML = '';
            
            // Sadece birden fazla boyut seçeneği olanlar buraya gelecek.
            product.sizes.forEach(size => {
                const sizeButton = document.createElement('button');
                sizeButton.className = "w-full p-4 bg-primary text-white text-lg font-semibold rounded-lg shadow-md hover:bg-primary/90 transition-colors flex justify-between items-center";
                sizeButton.innerHTML = `
                    <span>${size.size} (${size.weight})</span>
                    <span>€${size.price.toFixed(2)}</span>
                `;
                sizeButton.onclick = () => selectSize(size);
                optionsContainer.appendChild(sizeButton);
            });
        }
        
        /**
         * İçecek modalını doldurur (Bu sadece bir kez yapılır)
         */
        function populateDrinkModal() {
            const optionsContainer = document.getElementById('drink-options');
            optionsContainer.innerHTML = '';
            menuData.drinks.forEach(drink => {
                const drinkButton = `
                    <button onclick="selectDrink('${drink.id}')" class="w-full p-4 bg-white border border-gray-300 rounded-lg shadow-sm hover:border-primary hover:bg-primary/5 transition-colors flex justify-between items-center text-left">
                        <div>
                            <span class="text-lg font-semibold text-gray-800">${drink.name}</span>
                            <span class="text-sm text-gray-500 block">${drink.description}</span>
                        </div>
                        <span class="text-lg font-bold text-secondary">+ €${drink.sizes[0].price.toFixed(2)}</span>
                    </button>
                `;
                optionsContainer.innerHTML += drinkButton;
            });
        }

        /**
         * Akış 2. Adım: Kullanıcı bir boyut seçtiğinde (XL veya XXL)
         */
        function selectSize(size) {
            currentSizeSelection = { size: size.size, price: size.price };
            toggleSizeModal(false);
            toggleDrinkModal(true);
        }

        /**
         * Akış 3. Adım: Kullanıcı bir içecek seçtiğinde
         */
        function selectDrink(drinkId) {
            const drinkProduct = menuData.drinks.find(d => d.id === drinkId);
            const drinkSize = drinkProduct.sizes[0];
            
            // 1. Ana ürünü sepete ekle
            addItemToCart(currentProductToAdd, currentSizeSelection);
            
            // 2. İçeceği sepete ekle (ayrı bir ürün olarak)
            addItemToCart(drinkProduct, drinkSize);
            
            // Modalları kapat ve sıfırla
            toggleDrinkModal(false);
            resetAddFlow();
            showToast(`${currentProductToAdd.name} ve ${drinkProduct.name} sepete eklendi.`);
        }

        /**
         * Akış 3. Alternatif: Kullanıcı içecek istemediğinde
         */
        function skipDrink() {
            // Sadece ana ürünü sepete ekle
            addItemToCart(currentProductToAdd, currentSizeSelection);
            
            // Modalları kapat ve sıfırla
            toggleDrinkModal(false);
            resetAddFlow();
            showToast(`${currentProductToAdd.name} sepete eklendi.`);
        }
        
        /**
         * Akış sıfırlama
         */
        function resetAddFlow() {
            currentProductToAdd = null;
            currentSizeSelection = null;
        }

        // --- 5. SEPET YÖNETİMİ (Cart Management) ---

        /**
         * Ürünü sepete ekler (ana mantık)
         */
        function addItemToCart(product, sizeInfo) {
            // Sepet öğesi için benzersiz bir kimlik oluştur (örn: 's1_XL' veya 'dr1_330ml')
            const cartItemId = `${product.id}_${sizeInfo.size}`;
            
            // Bu ürün bu boyutla zaten sepette var mı?
            const existingItem = cart.find(item => item.cartItemId === cartItemId);

            if (existingItem) {
                // Varsa, adedi artır
                existingItem.quantity++;
            } else {
                // Yoksa, yeni bir sepet öğesi oluştur
                cart.push({
                    cartItemId: cartItemId,
                    id: product.id,
                    name: product.name,
                    size: sizeInfo.size,
                    price: sizeInfo.price,
                    quantity: 1,
                    image: product.image // Sepette göstermek için
                });
            }
            // Sepeti güncelle
            updateCart();
        }

        /**
         * Sepet miktarını günceller (+ veya -)
         */
        function updateQuantity(cartItemId, change) {
            const item = cart.find(item => item.cartItemId === cartItemId);
            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {
                // Adet 0 veya altına düşerse, sepetten kaldır
                removeFromCart(cartItemId);
            } else {
                updateCart();
            }
        }

        /**
         * Ürünü sepetten kaldırır
         */
        function removeFromCart(cartItemId) {
            cart = cart.filter(item => item.cartItemId !== cartItemId);
            updateCart();
        }

        /**
         * Sepet arayüzünü (DOM) ve toplam fiyatı günceller
         * !!! HATA DÜZELTMESİ: 'cart-empty-msg' ile 'cart-items' 'ın silme/gösterme mantığı düzeltildi !!!
         */
        function updateCart() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotalEl = document.getElementById('cart-total');
            const cartCountEl = document.getElementById('cart-count');
            const cartEmptyMsg = document.getElementById('cart-empty-msg'); // Bu 'p' elementi artık güvende
            const confirmOrderBtn = document.getElementById('confirm-order-btn');

            // 'cart-items' div'ini her zaman temizle
            cartItemsContainer.innerHTML = ''; 

            let total = 0;
            let totalItems = 0;

            if (cart.length === 0) {
                // Sepet boşsa
                cartEmptyMsg.style.display = 'block'; // Boş mesajını göster
                confirmOrderBtn.disabled = true;
            } else {
                // Sepette ürün varsa
                cartEmptyMsg.style.display = 'none'; // Boş mesajını gizle
                confirmOrderBtn.disabled = false;

                // Ürünleri 'cart-items' div'ine ekle
                cart.forEach(item => {
                    total += item.price * item.quantity;
                    totalItems += item.quantity;

                    const cartItemHTML = `
                        <div class="flex items-center justify-between py-3 border-b last:border-b-0">
                            <div class="flex items-center space-x-3">
                                <img src="${item.image}" alt="${item.name}" class="w-16 h-16 rounded-lg object-cover shadow-md" onerror="this.src='https://placehold.co/100x100/cccccc/FFFFFF?text=...'">
                                <div>
                                    <h4 class="font-bold text-gray-800">${item.name}</h4>
                                    <span class="text-sm text-gray-500">${item.size}</span>
                                    <span class="text-sm text-primary font-semibold block">€${item.price.toFixed(2)}</span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-3">
                                <!-- Adet Kontrolü -->
                                <div class="flex items-center border border-gray-300 rounded-lg">
                                    <button onclick="updateQuantity('${item.cartItemId}', -1)" class="w-8 h-8 text-lg font-bold text-primary hover:bg-gray-100">-</button>
                                    <span class="w-10 text-center font-semibold">${item.quantity}</span>
                                    <button onclick="updateQuantity('${item.cartItemId}', 1)" class="w-8 h-8 text-lg font-bold text-primary hover:bg-gray-100">+</button>
                                </div>
                                <!-- Sil Butonu -->
                                <button onclick="removeFromCart('${item.cartItemId}')" class="text-red-500 hover:text-red-700 transition-colors">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    cartItemsContainer.innerHTML += cartItemHTML;
                });
            }

            cartTotalEl.innerText = `€${total.toFixed(2)}`;
            cartCountEl.innerText = totalItems;

            // Sepeti localStorage'e kaydet
            saveCart();
        }

        /**
         * Sepeti localStorage'e kaydeder
         */
        function saveCart() {
            localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
        }

        /**
         * Sepeti localStorage'den yükler
         */
        function loadCart() {
            const storedCart = localStorage.getItem(CART_STORAGE_KEY);
            if (storedCart) {
                cart = JSON.parse(storedCart);
            }
            updateCart();
        }

        // --- 6. SİPARİŞ ONAYI VE NUMARA ÜRETME ---

        /**
         * Kullanıcı "Siparişi Onayla" butonuna bastığında
         */
        function confirmOrder() {
            if (cart.length === 0) return;

            const orderNumber = getNewOrderNumber();
            document.getElementById('order-number').innerText = String(orderNumber).padStart(3, '0');
            
            // Sepeti temizle
            cart = [];
            updateCart(); // Arayüzü ve localStorage'i günceller
            
            // Modalları kapat/aç
            toggleCartModal(false);
            toggleSuccessModal(true);
        }

        /**
         * Benzersiz, günlük sıfırlanan sipariş numarası üretir
         */
        function getNewOrderNumber() {
            const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD formatı
            let orderCounter;

            try {
                orderCounter = JSON.parse(localStorage.getItem(ORDER_COUNTER_KEY));
            } catch (e) {
                orderCounter = null;
            }

            if (!orderCounter || orderCounter.date !== today) {
                // Gün değişti veya ilk sipariş
                // Yeni bir başlangıç numarası ata (101 ile 601 arası)
                const startNumber = Math.floor(Math.random() * 501) + 101; 
                orderCounter = {
                    date: today,
                    number: startNumber
                };
            } else {
                // Aynı gün, numarayı artır
                orderCounter.number++;
            }

            // Yeni sayacı kaydet
            localStorage.setItem(ORDER_COUNTER_KEY, JSON.stringify(orderCounter));
            
            // Sadece 3 haneli kısmı al (eğer 999'u aşarsa 1000 yerine 000 veya 001'e dönmesin, 1000 olsun)
            // Kullanıcı 3 haneli istedi, 999'dan sonra 1000, 1001 diye devam etmesi daha mantıklı.
            // Amaç gün içinde benzersiz olmasıysa, 3 haneye sadık kalmak için:
            // return orderCounter.number % 1000; (Eğer 999'dan sonra 000'a dönmesi istenirse)
            
            // Biz 3 haneli "en az" diyelim ve 101'den başlatalım
            return orderCounter.number;
        }

        // --- 7. MODAL KONTROLLERİ VE YARDIMCI FONKSİYONLAR ---

        function toggleCartModal(show) {
            toggleModal('cart-modal', show);
        }
        function toggleSizeModal(show) {
            toggleModal('size-modal', show);
        }
        function toggleDrinkModal(show) {
            toggleModal('drink-modal', show);
        }
        function toggleSuccessModal(show) {
            toggleModal('order-success-modal', show);
        }

        function closeSizeModal() {
            toggleSizeModal(false);
            resetAddFlow();
        }
        function closeDrinkModal() {
            toggleDrinkModal(false);
            resetAddFlow();
        }
        function closeSuccessModal() {
            toggleSuccessModal(false);
        }

        /**
         * Genel modal açma/kapatma fonksiyonu
         */
        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }
        
        /**
         * Modalların dışına tıklandığında kapatma (Sepet hariç)
         */
        function attachModalListeners() {
             document.querySelectorAll('.modal').forEach(modal => {
                if(modal.id === 'cart-modal') {
                     // Sepet modalı için özel: Dışına tıklayınca kapat
                    modal.addEventListener('click', (e) => {
                        if (e.target.id === 'cart-modal') {
                            toggleCartModal(false);
                        }
                    });
                }
             });
        }
        
        /**
         * Kullanıcıya geçici bildirim gösterir (Toast)
         */
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-primary text-white p-4 rounded-lg shadow-xl z-[100] transform translate-y-16 opacity-0 transition-all duration-300';
            toast.innerText = message;
            document.body.appendChild(toast);
            
            // Animasyonla göster
            setTimeout(() => {
                toast.style.transform = 'translate-y(0)';
                toast.style.opacity = '1';
            }, 100);
            
            // 3 saniye sonra kaldır
            setTimeout(() => {
                toast.style.transform = 'translate-y(16)';
                toast.style.opacity = '0';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

    </script>
</body>
